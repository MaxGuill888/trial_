plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Ajoutez vos dépôts secondaires ici si nécessaire
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "autovault" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Les versions exactes doivent être définies dans votre fichier gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mappings officiels de Mojang (requis par Loom pour décoder le code de Minecraft)
    mappings minecraft.officialMojangMappings()

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mod uniquement client — Fabric API est chargé ici pour le sourceSet client
    clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    def mc_version = project.minecraft_version
    
    inputs.property "version", version
    inputs.property "minecraft_version", mc_version

    filesMatching("fabric.mod.json") {
        expand "version": version, "minecraft_version": mc_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs.addAll([
        "-Xlint:all",
        "-Xlint:-classfile",
        "-Xlint:-options",
        "-Xlint:-processing",
        "-Werror"
    ])
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Configuration de publication à distance si nécessaire
    }
}
